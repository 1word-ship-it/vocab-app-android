name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: find . -maxdepth 4 -name "settings.gradle" -o -name "build.gradle" | head -20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          ROOT=$(dirname $(find . -name settings.gradle -not -path '*/.gradle/*' | head -1))
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
            find . -maxdepth 5 -type f \( -name "*.gradle" -o -name "*.java" -o -name "*.xml" \) | head -30
            echo "---"
            ls -la
            exit 1
          fi
          echo "Building from: $ROOT"
          cd "$ROOT" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vocab-app-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
